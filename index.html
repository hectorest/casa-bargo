<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa-barco</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
<style>
  :root { --tinta: #173543; --crema: #fbf3e4; --ambar: #e8a33d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc7d8; font-family: "Trebuchet MS", system-ui, sans-serif; }
  body > canvas { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 3vh; right: 2.5vw; width: 17vw; min-width: 200px; padding: 1.4vw;
    background: var(--crema); color: var(--tinta); border-radius: 1.2vw; box-shadow: 0 .6vw 2vw rgba(0,0,0,.18);
    transition: width .5s, padding .5s;
  }
  #panel h1 { margin: 0 0 .6vw; font-size: 1.5vw; }
  #qr { width: 100%; height: auto; max-height: 45vh; object-fit: contain; image-rendering: pixelated; border-radius: .6vw; display: block; }
  #codigo { font-size: 2.6vw; font-weight: 700; letter-spacing: .3em; text-align: center; margin: .5vw 0 0; }
  #urlMando { font-size: .75vw; opacity: .6; text-align: center; word-break: break-all; margin-bottom: .6vw; }
  #panel.compacto { width: 11vw; padding: 1vw; }
  #panel.compacto h1 { font-size: 1.1vw; }
  #panel.compacto #codigo { font-size: 1.8vw; }
  #panel.compacto #urlMando { display: none; }
  #jugadores { list-style: none; margin: .8vw 0 0; padding: 0; font-size: 1.05vw; }
  #jugadores li { display: flex; align-items: center; gap: .5vw; padding: .25vw 0; }
  #jugadores em { margin-left: auto; font-style: normal; opacity: .7; font-size: .85vw; }
  #jugadores .vacio { opacity: .55; font-style: italic; }
  .punto { display: inline-block; width: .9vw; height: .9vw; border-radius: 50%; flex: none; }
  #estadoSala { font-size: .8vw; color: #a0522d; margin-top: .4vw; }

  #marcador { position: fixed; top: 3vh; left: 2.5vw; display: flex; gap: 1vw; }
  #marcador div { background: rgba(251,243,228,.92); color: var(--tinta); padding: .5vw 1vw; border-radius: .8vw; font-size: 1.3vw; font-weight: 700; }
  #piloto { font-weight: 400 !important; font-size: 1.05vw !important; }

  #avisos { position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .6vw; }
  .aviso {
    background: rgba(23,53,67,.88); color: var(--crema); padding: .7vw 1.6vw; border-radius: 2vw; font-size: 1.3vw;
    display: flex; align-items: center; gap: .6vw; animation: entrar .35s ease-out; transition: opacity .5s, transform .5s;
  }
  .aviso.fuera { opacity: 0; transform: translateY(1vw); }
  @keyframes entrar { from { opacity: 0; transform: translateY(1vw); } }

  #sonido { position: fixed; bottom: 2vh; right: 2vw; background: rgba(23,53,67,.75); color: var(--crema); padding: .4vw .9vw; border-radius: 1vw; font-size: .9vw; }
  #depuracion { position: fixed; bottom: 2vh; left: 2vw; display: none; white-space: pre; background: rgba(0,0,0,.65); color: #cfe; font: .8vw/1.4 ui-monospace, monospace; padding: .6vw .9vw; border-radius: .5vw; }
  #depuracion.visible { display: block; }
  #fatal { position: fixed; inset: 0; display: none; padding: 4vw; background: #3a1414; color: #fff; font: 1.4vw/1.5 system-ui; white-space: pre-wrap; z-index: 10; }
</style>
</head>
<body>
<div id="marcador"><div id="cajas">📦 0</div><div id="piloto">🧭 Piloto automático</div></div>
<aside id="panel">
  <h1>¡Sube a bordo!</h1>
  <canvas id="qr" width="10" height="10"></canvas>
  <div id="codigo">····</div>
  <div id="urlMando"></div>
  <ul id="jugadores"></ul>
  <div id="estadoSala"></div>
</aside>
<div id="avisos"></div>
<div id="sonido">🔇 Pulsa OK en el mando de la tele para activar el sonido</div>
<div id="depuracion"></div>
<div id="fatal"></div>

<script>
  // Si algo falla antes de arrancar (p. ej. sin acceso al CDN), mostrarlo en la tele.
  function mostrarFatal(m) { const el = document.getElementById('fatal'); el.style.display = 'block'; el.textContent = '⚠ ' + m + '\n\n' + navigator.userAgent; }
  window.addEventListener('error', e => { if (!window.__arrancado) mostrarFatal(e.message); });
  setTimeout(() => { if (!window.__arrancado) mostrarFatal('El juego no ha arrancado en 15 s. ¿Hay acceso a internet (cdn.jsdelivr.net)?'); }, 15000);
</script>
<script type="module">
  window.__arrancado = true;
  import('./js/tv/main.js').catch(e => mostrarFatal(e.stack || e.message));
</script>
</body>
</html>
